version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "./sql/queries/audio.sql"
    schema: "./sql/schema/schema.sql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        sql_package: "pgx/v5"
        overrides:
        - db_type: "uuid"
          go_type:
            import: "github.com/google/uuid"
            type: "UUID"
